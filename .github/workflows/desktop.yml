name: Desktop installers

# 설치형 PC 앱(apps/desktop)의 설치 파일을 만든다. **손으로 돌린다** — 릴리스는
# 웹 배포와 주기가 다르고(셸은 자주 바뀌지 않는다), macOS 러너는 분당 과금이
# ubuntu의 10배다. 그래서 매 커밋이 아니라 필요할 때만 돌린다:
#
#   Actions → Desktop installers → Run workflow
#
# 지금은 **서명하지 않는다**(사용자 결정 — 내부·테스트 배포부터). 인증서가
# 준비되면 아래 주석의 시크릿을 채우면 되고, 그 밖의 구조는 그대로다.
#
# 이 워크플로는 apps/web을 빌드하지 않는다 — 셸이 원격 출처(geurio.com)를 그대로
# 띄우므로 설치 파일에 웹 산출물이 들어가지 않는다(apps/desktop/src/main.ts).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '만들 설치 파일'
        type: choice
        default: all
        options: [all, windows, macos, store]
  # 태그를 밀면 함께 돈다(예: desktop-v0.1.0) — 릴리스에 붙일 산출물을 만드는 자리.
  push:
    tags: ['desktop-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 어느 설치 파일을 만들지 먼저 고른다. **matrix를 잡 밖에서 정하는 이유**는
  # 고르지 않은 플랫폼의 잡이 아예 생기지 않아야 하기 때문이다 — 잡 수준 `if`는
  # `matrix`를 볼 수 없고(GitHub 컨텍스트 제약), 스텝마다 건너뛰면 러너는 그대로
  # 뜬다. macOS 러너는 분당 과금이 ubuntu의 10배라 "Windows 하나만" 같은 흔한
  # 경우에 mac 러너를 태울 이유가 없다.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # 태그로 돌 때만: 태그 이름과 셸 버전이 같은지 **빌드 전에** 본다.
      #
      # 버전의 정본은 `apps/desktop/package.json`의 `version` 하나이고 태그는
      # 이름표일 뿐이다(README의 「새 판을 내보내는 절차」). 둘이 어긋나면 릴리스
      # 제목은 `desktop-v0.3.0`인데 그 안의 파일은 `Geurio Setup 0.2.0.exe`이고,
      # 매니페스트도 0.2.0이라 **아무에게도 "새 설치 버전이 있어요"가 뜨지 않는다**
      # — 빌드도 테스트도 초록이라 설치본을 눌러 봐야 드러나는 종류다.
      #
      # `build`가 아니라 여기서 막는 이유는 러너를 **하나도** 태우지 않기 때문이다
      # (태그 푸시는 둘을 만들고 macOS는 분당 과금이 ubuntu의 10배다).
      - name: Check tag matches shell version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"
          have="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error title=버전 불일치::태그는 $want 인데 apps/desktop/package.json은 $have 입니다. 버전을 먼저 올려 라이브까지 배포한 뒤 태그하세요(apps/desktop/README.md의 「새 판을 내보내는 절차」)."
            exit 1
          fi
          echo "태그 $GITHUB_REF_NAME ↔ 셸 $have — 일치"

      - id: pick
        shell: bash
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          win='{"artifact":"windows","os":"windows-latest","target":"pack:win","glob":"apps/desktop/release/*.exe"}'
          mac='{"artifact":"macos","os":"macos-latest","target":"pack:mac","glob":"apps/desktop/release/*.dmg"}'
          # Microsoft Store 채널(MSIX). **서명하지 않는다** — Store는 Microsoft가
          # 패키지에 서명하므로 우리 인증서를 넣으면 정체성이 어긋난다
          # (electron-builder는 인증서가 없으면 "AppX is not signed
          # (Windows Store only build)"로 넘어가고 설정된 `publisher`를 그대로 쓴다).
          # 제출 절차는 apps/desktop/STORE.md.
          store='{"artifact":"store","os":"windows-latest","target":"pack:appx","glob":"apps/desktop/release/*.appx"}'
          # 태그 푸시에는 입력이 없다 → 기본값(all)로 본다.
          want='${{ inputs.targets }}'
          [ -z "$want" ] && want=all
          # **태그 푸시에서는 store를 빼고 all을 읽는다.** 태그로 만든 산출물은
          # 그대로 릴리스에 붙는데(`Attach to release`), 지금 MSIX는 개발용
          # 자가서명이라 **받는 사람이 설치할 수 없다** — 릴리스에 나란히 놓이면
          # 어느 것을 받아야 하는지 흐려진다. Store 패키지는 제출 절차를 밟는
          # 사람이 `store`를 **직접 골라** 만든다(그때는 릴리스에 붙지 않는다).
          # Partner Center 정체성으로 바꿔 설치 가능해지면 이 분기를 지우면 된다.
          case "$want" in
            windows) inc="[$win]" ;;
            macos)   inc="[$mac]" ;;
            store)   inc="[$store]" ;;
            *)       if [ "$IS_TAG" = true ]; then inc="[$win,$mac]"; else inc="[$win,$mac,$store]"; fi ;;
          esac
          echo "고른 대상: $want (태그: $IS_TAG)"
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    # 릴리스를 만들려면 쓰기가 필요하다(기본값은 읽기). `plan`에는 주지 않는다 —
    # 권한은 그것을 쓰는 잡에만 준다.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # electron-builder는 패키징용 Electron을 **스스로** 받으므로(버전은
        # apps/desktop/package.json에서 읽는다) `electron` 패키지의 postinstall
        # 바이너리는 필요하지 않다.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: pnpm install --frozen-lockfile

      # 지금 설정된 MSIX 정체성을 로그에 남긴다. Partner Center가 배정한 값으로
      # 바꾸지 않으면 패키지는 **만들어지지만 제출할 수 없다**(정체성 불일치로
      # 거절된다) — 빌드는 성공하므로 로그가 말해 주지 않으면 올려 보고서야 안다.
      - name: Show MSIX identity
        if: matrix.artifact == 'store'
        shell: bash
        run: |
          echo "--- apps/desktop/electron-builder.yml (appx):"
          sed -n '/^appx:/,/^[a-z]/p' apps/desktop/electron-builder.yml | grep -E 'identityName|publisher' || true
          if grep -q 'publisher: CN=Geurio Dev' apps/desktop/electron-builder.yml; then
            echo "::warning title=자가서명 정체성::이 패키지는 로컬 테스트용입니다 — Store에 제출할 수 없습니다. STORE.md 2단계를 보세요."
          fi

      - name: Build installer
        # 서명 인증서가 준비되면 여기에 시크릿을 넣는다(구조는 그대로):
        #   Windows: CSC_LINK(.pfx base64) + CSC_KEY_PASSWORD
        #   macOS:   CSC_LINK(.p12 base64) + CSC_KEY_PASSWORD
        #            + 공증용 APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER
        #              (또는 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID)
        #            그때 electron-builder.yml의 `mac.identity: null`을 지우고
        #            `hardenedRuntime`을 **true로** 바꾼다 — 공증이 요구한다.
        #            절차 전체는 apps/desktop/README.md의 「macOS 공증」.
        env:
          # 무서명 빌드에서 electron-builder가 인증서를 찾다 실패하지 않게.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm --filter @mindflow/desktop run ${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: geurio-desktop-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14

      # ── 태그를 밀었을 때만: GitHub Release에 붙인다 ──────────────────────────
      # 아티팩트는 **14일 만료 + GitHub 로그인 필요**라 앱이 안내할 다운로드
      # 주소가 될 수 없다(설정 › 버전 확인의 `다운로드`가 여는 곳이다). 릴리스는
      # 만료가 없고 공개 저장소에서는 로그인 없이 받힌다.
      #
      # `gh`를 쓴다(서드파티 액션이 아니라) — 러너에 이미 깔려 있고 공급망이
      # 하나 줄어든다. matrix 잡이 **동시에** 돌므로 먼저 도착한 잡이 릴리스를
      # 만들고 나머지는 그 릴리스에 올린다: `create`는 이미 있으면 실패하므로
      # 삼키고(`|| true`), `upload --clobber`가 같은 이름 파일을 덮어쓴다.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --title "$tag" --generate-notes || true
          # 글롭을 셸이 풀게 둔다 — macOS는 x64·arm64 두 개다.
          gh release upload "$tag" ${{ matrix.glob }} --clobber
