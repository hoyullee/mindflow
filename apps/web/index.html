<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0663f" />
    <meta name="description" content="그리오(Geurio) — 마인드맵, 화이트보드, 칸반 보드. 지금 하는 일에 맞는 방식으로 생각을 정리하고 함께 완성하세요." />
    <title>Geurio</title>
    <!-- SEO: 이 셸은 /login·/privacy 등 SPA 라우트로 서빙된다(app.html —
         vite.config.ts landingRootSwap 참고). 링크 공유 시 미리보기 카드용
         OG/트위터 태그 — 페이지별 og:url은 두지 않는다(라우트가 여럿이라). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geurio" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="그리오 Geurio — 마인드맵 · 화이트보드 · 칸반" />
    <meta property="og:description" content="마인드맵, 화이트보드, 칸반 보드. 지금 하는 일에 맞는 방식으로 생각을 정리하고 함께 완성하세요." />
    <meta property="og:image" content="https://geurio.com/og/og-card-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="그리오 Geurio — 마인드맵 · 화이트보드 · 칸반" />
    <meta name="twitter:description" content="마인드맵, 화이트보드, 칸반 보드. 지금 하는 일에 맞는 방식으로 생각을 정리하고 함께 완성하세요." />
    <meta name="twitter:image" content="https://geurio.com/og/og-card-v2.png" />
    <!-- M6: Pretendard is now self-hosted (see src/index.css's @font-face) so it's
         precached by the service worker and works offline / behind a CDN block —
         no external stylesheet link here anymore. -->
    <!-- 폰트를 최우선으로 미리 받아 첫 페인트 시 시스템폰트→Pretendard 교체로
         텍스트 정렬이 틀어졌다 돌아오는 깜빡임(레이아웃 시프트)을 없앤다.
         (@font-face는 optional이라, 이 프리로드로 제때 도착하면 처음부터 Pretendard.)
         폰트는 CORS(anonymous)로 받으므로 same-origin이라도 crossorigin 필수. -->
    <link rel="preload" href="/fonts/pretendard/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
