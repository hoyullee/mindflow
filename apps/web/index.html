<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0663f" />
    <meta name="description" content="그리오(Geurio) — 마인드맵, 화이트보드, 칸반 보드. 지금 하는 일에 맞는 방식으로 생각을 정리하고 함께 완성하세요." />
    <title>Geurio</title>
    <!-- SEO: 이 셸은 /login·/privacy 등 SPA 라우트로 서빙된다(app.html —
         vite.config.ts landingRootSwap 참고). 링크 공유 시 미리보기 카드용
         OG/트위터 태그 — 페이지별 og:url은 두지 않는다(라우트가 여럿이라). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geurio" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="그리오 Geurio — 마인드맵 · 화이트보드 · 칸반" />
    <meta property="og:description" content="마인드맵, 화이트보드, 칸반 보드. 지금 하는 일에 맞는 방식으로 생각을 정리하고 함께 완성하세요." />
    <meta property="og:image" content="https://geurio.com/og/og-card-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="그리오 Geurio — 마인드맵 · 화이트보드 · 칸반" />
    <meta name="twitter:description" content="마인드맵, 화이트보드, 칸반 보드. 지금 하는 일에 맞는 방식으로 생각을 정리하고 함께 완성하세요." />
    <meta name="twitter:image" content="https://geurio.com/og/og-card-v2.png" />
    <!-- M6: Pretendard is now self-hosted (see src/index.css's @font-face) so it's
         precached by the service worker and works offline / behind a CDN block —
         no external stylesheet link here anymore. -->
    <!-- 폰트는 **프리로드하지 않는다**(제보: 콘솔에 "preloaded ... but not used
         within a few seconds" 경고). 예전 주석은 `@font-face`가 `optional`이라
         프리로드가 제때 도착해야 Pretendard가 쓰인다고 적어 뒀는데 실제 값은
         `swap`이다(src/index.css) — swap은 언제 도착하든 그때 갈아 끼우므로
         프리로드가 없어도 결국 Pretendard로 그려진다. 그리고 정렬이 틀어지는 것은
         `Pretendard-fallback`(ascent/descent 오버라이드)이 막는다 — 그 face의
         존재 이유가 바로 "교체 순간 줄상자가 움직이지 않게"다.
         남는 것은 비용뿐이었다. 이 파일은 2MB이고 프리로드는 **load 이벤트를 막는다**
         — 실측(스로틀 A/B, /login): 10Mbps 3295→1741ms · 3Mbps 10376→4988ms ·
         1.5Mbps 20418→9707ms로 load가 대략 절반이 된다. 첫 방문에 글리프 모양이
         한 번 바뀌는 대가로 앱이 두 배 빨리 뜬다. 되돌리려면 `optional`과 함께
         써야 한다(그때는 프리로드가 실제로 판단을 가른다). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
