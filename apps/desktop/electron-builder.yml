# 설치 파일 설정. **서명은 아직 하지 않는다**(사용자 결정) — 내부·테스트 배포가
# 먼저다. 그래서 지금 산출물은:
#   - Windows: SmartScreen이 "알 수 없는 발행자" 경고를 띄운다(추가 정보 →
#     실행). 서명 인증서(EV/OV)를 CI 시크릿에 넣으면 그때 사라진다.
#   - macOS: Gatekeeper가 막는다 → 우클릭 → 열기, 또는
#     `xattr -dr com.apple.quarantine /Applications/Geurio.app`.
#     서명+공증(notarization)을 하면 그때 사라진다. README.md 참고.
appId: com.geurio.app
# `productName`·`version`·`author`는 **package.json**에 둔다 — 여기에도 적으면
# 두 곳이 갈리고, 무엇보다 Electron의 `app.getName()`은 패키징된 package.json을
# 읽으므로 그쪽이 정본이어야 한다(앱 이름·userData 폴더 이름이 거기서 나온다).
copyright: © Geurio

directories:
  output: release
  buildResources: build

# 셸에는 **런타임 의존성이 없다**(main·preload는 순수 컴파일 결과) — 그래서
# node_modules를 통째로 담지 않아도 되고, pnpm 워크스페이스의 심링크 구조가
# 패키징을 어렵게 만드는 문제도 애초에 생기지 않는다.
# 커스텀 프로토콜 — **한 곳에 적는다**. electron-builder가 이 블록에서
# Windows(MSIX 매니페스트의 `windows.protocol` 확장)와 macOS(`CFBundleURLTypes`)를
# 함께 만들어 준다. 예전에는 mac 쪽만 `extendInfo`에 손으로 적어 뒀는데, MSIX를
# 붙이면서 같은 사실을 두 곳에 적을 이유가 없어졌다.
#
# 이 프로토콜이 곧 로그인 경로다 — 시스템 브라우저에서 끝낸 Google 로그인이
# `geurio://auth?refresh_token=…`로 앱에 돌아온다(apps/desktop/src/main.ts).
# **MSIX에서는 `app.setAsDefaultProtocolClient`가 무효다**(매니페스트가 이긴다) —
# 그래서 이 선언이 없으면 패키지 앱에서 로그인이 완주하지 못한다.
protocols:
  - name: Geurio
    schemes: [geurio]

files:
  - dist/**/*
  - resources/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  # 서명 인증서가 없을 때 electron-builder가 실패하지 않게(경고만).
  signAndEditExecutable: true

nsis:
  # 관리자 권한을 요구하지 않는다 — 사용자별 설치라 IT 승인 없이 설치된다.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Geurio

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  # 서명 인증서가 없으므로 electron-builder의 서명 단계를 건너뛴다. 대신
  # `scripts/adhoc-sign.cjs`(afterPack)가 **애드혹 서명**을 붙인다 — Apple
  # Silicon은 서명이 아예 없으면 앱을 실행조차 못 하게 막는다.
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSHighResolutionCapable: true

dmg:
  title: Geurio

# ── Microsoft Store 채널(MSIX) ──────────────────────────────────────────────
# Store에 올리면 **Microsoft가 패키지에 서명한다** → 코드 서명 인증서를 사지
# 않아도 SmartScreen 경고가 없다(Windows 한정 — macOS는 Apple Developer Program
# 연회비가 직접 배포·App Store 양쪽의 근거라 아끼는 것이 없다).
#
# 지금 값은 **자가서명 로컬 설치용**이다. Partner Center에 앱을 예약하면 거기서
# 배정한 값으로 `identityName`·`publisher`·`publisherDisplayName` 세 줄을 바꾼다
# (그 전에는 Store에 올릴 수 없다 — 정체성은 우리가 지어낼 수 없다).
#
# `publisher`는 **서명 인증서의 Subject와 글자 하나까지 같아야** 한다. 다르면
# `Add-AppxPackage`가 서명/발행자 불일치로 거절한다. 그래서 개발용 인증서를
# 만드는 `scripts/dev-cert.ps1`은 이 파일에서 그 값을 **직접 읽는다** — 두 곳에
# 적어 두면 반드시 갈린다.
appx:
  identityName: Geurio.Desktop
  publisher: CN=Geurio Dev
  publisherDisplayName: Geurio
  applicationId: Geurio
  displayName: Geurio
  languages: [ko-KR, en-US]
  # 타일 배경(브랜드 코럴). 타일 이미지 4종은 build/appx/에 있다 —
  # 없으면 electron-builder가 **자기 샘플 아트**를 대신 넣는다(남의 로고가
  # 설치본에 실리는 셈이라 반드시 둔다). scripts/generate-desktop-icon.mjs가 만든다.
  backgroundColor: '#f0663f'

afterPack: scripts/adhoc-sign.cjs

# 자동 업데이트는 아직 붙이지 않는다 — 서명 없이는 신뢰할 수 있는 갱신 경로가
# 아니고(무서명 산출물을 자동으로 받아 실행하는 셈), 애초에 앱 화면 자체는 웹
# 배포가 곧 최신이라 셸을 자주 갱신할 이유가 없다. README.md의 "다음 단계" 참고.
publish: null
