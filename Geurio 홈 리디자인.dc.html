<style>
  body { margin:0; background:#FBF7F3; font-family:Pretendard,system-ui,sans-serif; -webkit-font-smoothing:antialiased; color:#3A352F; }
  a { color:#E0602F; text-decoration:none; }
  a:hover { opacity:.72; }
  button, input { font-family:inherit; }
  .gh-scroll::-webkit-scrollbar { height:8px; width:8px; }
  .gh-scroll::-webkit-scrollbar-thumb { background:#E9DDD1; border-radius:99px; }
  .gh-scroll::-webkit-scrollbar-track { background:transparent; }
  .gh-card:hover { transform:translateY(-3px); box-shadow:0 24px 44px -26px rgba(46,42,38,.42); border-color:#E7DACC; }
  .gh-card:hover .gh-open { opacity:1; transform:translateY(0); }
  .gh-hscroll { scrollbar-width:thin; scrollbar-color:transparent transparent; -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%); mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%); }
  .gh-hscroll:hover { scrollbar-color:#E4D6C7 transparent; }
  .gh-hscroll::-webkit-scrollbar { height:6px; }
  .gh-hscroll::-webkit-scrollbar-track { background:transparent; }
  .gh-hscroll::-webkit-scrollbar-thumb { background:transparent; border-radius:99px; transition:background .18s ease; }
  .gh-hscroll:hover::-webkit-scrollbar-thumb { background:#E4D6C7; }
  .gh-hscroll::-webkit-scrollbar-thumb:hover { background:#D3BFA9; }
  .gh-fav-off { opacity:0; }
  .gh-card:hover .gh-fav-off { opacity:1; }
  @keyframes ghFade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
</style>

<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:#FBF7F3">

  <aside style="width:250px;flex:0 0 auto;display:flex;flex-direction:column;background:#FFFDFB;border-right:1px solid #F0E6DC;padding:14px 12px 12px">

    <button style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid transparent;border-radius:13px;background:transparent;cursor:pointer;text-align:left;width:100%" style-hover="background:#FBF3EE;border-color:#F3E9E0">
      <span style="width:32px;height:32px;flex:0 0 auto;border-radius:11px;background:linear-gradient(180deg,#F2764C,#E85E33);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:-.03em">호율</span>
      <span style="display:flex;flex-direction:column;gap:1px;min-width:0;flex:1">
        <span style="font-size:13.5px;font-weight:700;letter-spacing:-.01em">이호율</span>
        <span style="font-size:11px;color:#A29B90">개인 워크스페이스</span>
      </span>
      <svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A29B90" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
    </button>

    <div class="gh-scroll" style="flex:1;min-height:0;overflow-y:auto;margin-top:14px;display:flex;flex-direction:column;gap:20px">

      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 9px 7px">
          <span style="font-size:10.5px;font-weight:800;letter-spacing:.07em;color:#B7ACA1;text-transform:uppercase">스페이스</span>
        </div>
        <sc-for list="{{ spaces }}" as="s" hint-placeholder-count="4">
          <button sc-camel-on-click="{{ s.onPick }}" style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;border-radius:10px;background:{{ s.bg }};color:{{ s.fg }};cursor:pointer;font-size:13px;font-weight:{{ s.weight }};text-align:left;letter-spacing:-.01em;transition:background .14s ease" style-hover="background:#FBF3EE">
            <span style="width:9px;height:9px;flex:0 0 auto;border-radius:3px;background:{{ s.dot }};display:block"></span>
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.name }}</span>
            <sc-if value="{{ s.active }}" hint-placeholder-val="{{ false }}">
              <span style="width:5px;height:5px;border-radius:99px;background:#E85E33;display:block"></span>
            </sc-if>
          </button>
        </sc-for>
        <button style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;margin-top:2px;border:0;border-radius:10px;background:transparent;color:#8A8078;cursor:pointer;font-size:13px;text-align:left" style-hover="background:#FBF3EE;color:#3A352F">
          <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto"><path d="M12 5v14M5 12h14"></path></svg>
          새 스페이스
        </button>
      </div>

      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 9px 7px">
          <span style="font-size:10.5px;font-weight:800;letter-spacing:.07em;color:#B7ACA1;text-transform:uppercase">공유받음</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#C3B8AC">2</span>
        </div>
        <sc-for list="{{ shared }}" as="s" hint-placeholder-count="2">
          <button style="display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;border-radius:10px;background:transparent;color:#6E675F;cursor:pointer;font-size:12.5px;text-align:left" style-hover="background:#FBF3EE;color:#3A352F">
            <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#B7ACA1" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5"></path></svg>
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.name }}</span>
          </button>
        </sc-for>
      </div>

      <div style="display:flex;flex-direction:column;gap:2px;padding-top:4px;border-top:1px solid #F4EBE3">
        <button style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;margin-top:6px;border:0;border-radius:10px;background:transparent;color:#6E675F;cursor:pointer;font-size:13px;text-align:left" style-hover="background:#FBF3EE;color:#3A352F">
          <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="#F5C062" stroke="#E8A93C" stroke-width="1.6" stroke-linejoin="round" style="flex:0 0 auto"><path d="m12 3.6 2.5 5.2 5.6.8-4 4 .9 5.6-5-2.7-5 2.7.9-5.6-4-4 5.6-.8z"></path></svg>
          즐겨찾기
        </button>
        <button style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;border-radius:10px;background:transparent;color:#6E675F;cursor:pointer;font-size:13px;text-align:left" style-hover="background:#FBF3EE;color:#3A352F">
          <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="#B7ACA1" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"></path></svg>
          <span style="flex:1">휴지통</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#C3B8AC">16</span>
        </button>
      </div>

    </div>

    <div style="padding-top:12px;border-top:1px solid #F4EBE3;margin-top:10px">
      <button style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;border-radius:10px;background:transparent;color:#8A8078;cursor:pointer;font-size:12.5px;text-align:left" style-hover="background:#FBF3EE;color:#3A352F">
        <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto"><path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.2-4.5A8 8 0 1 1 21 12z"></path></svg>
        피드백 보내기
      </button>
    </div>

  </aside>

  <main class="gh-scroll" style="flex:1;min-width:0;overflow-y:auto;overflow-x:hidden">

    <div style="padding:24px 32px 44px;display:flex;flex-direction:column;gap:34px;animation:ghFade .3s ease both">

      <sc-if value="{{ showRecents }}" hint-placeholder-val="{{ true }}">
      <section style="display:flex;flex-direction:column;gap:12px;padding-bottom:30px;border-bottom:1px solid #F1E8DF">
        <div style="display:flex;align-items:center;gap:8px">
          <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#B7ACA1" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>
          <span style="font-size:12.5px;font-weight:700;color:#8A8078;letter-spacing:-.01em">최근 항목</span>
          <span style="font-size:11px;color:#B7ACA1">모든 스페이스</span>
        </div>
        <div class="gh-hscroll" style="display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;padding:4px 32px 10px;margin:-4px -32px 0">
          <sc-for list="{{ recents }}" as="r" hint-placeholder-count="8">
            <div class="gh-card" style="flex:0 0 auto;width:158px;border-radius:15px;border:1px solid #F0E6DC;background:#FFFDFB;overflow:hidden;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;box-shadow:0 12px 26px -22px rgba(46,42,38,.4)">
              <div style="position:relative;height:74px;background:{{ r.wash }};overflow:hidden">
                <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(199,186,172,.5) 1px,transparent 1px);background-size:13px 13px"></div>
                <span style="position:absolute;top:7px;right:7px;z-index:2;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:99px;background:rgba(255,253,251,.94);border:1px solid #F0E6DC;font-size:9.5px;font-weight:700;color:#6E675F;white-space:nowrap;backdrop-filter:blur(6px)">
                  <span style="width:5px;height:5px;border-radius:2px;background:{{ r.kindDot }};display:block"></span>
                  {{ r.kind }}
                </span>
                <button class="{{ r.favClass }}" title="즐겨찾기" sc-camel-on-click="{{ r.onFav }}" style="position:absolute;top:7px;left:7px;z-index:2;width:24px;height:24px;border-radius:8px;border:1px solid #F0E6DC;background:rgba(255,253,251,.94);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .16s ease" style-hover="background:#FFF7EE">
                  <svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="{{ r.favFill }}" stroke="{{ r.favStroke }}" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3.6 2.5 5.2 5.6.8-4 4 .9 5.6-5-2.7-5 2.7.9-5.6-4-4 5.6-.8z"></path></svg>
                </button>
                <sc-for list="{{ r.shapes }}" as="s" hint-placeholder-count="3">
                  <div style="position:absolute;left:{{ s.l }};top:{{ s.t }};width:{{ s.w }};height:{{ s.h }};background:{{ s.bg }};border:1px solid {{ s.bd }};border-radius:{{ s.r }}"></div>
                </sc-for>
              </div>
              <div style="padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px">
                <div style="display:flex;align-items:center;gap:5px;min-width:0">
                  <span style="font-size:12px;font-weight:700;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.name }}</span>
                  <sc-if value="{{ r.shared }}" hint-placeholder-val="{{ false }}">
                    <svg width="11" height="11" sc-camel-view-box="0 0 24 24" fill="none" stroke="#B7ACA1" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto"><circle cx="9" cy="8" r="3"></circle><path d="M3 19a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-6M21 19a5 5 0 0 0-4-4.9"></path></svg>
                  </sc-if>
                </div>
                <div style="display:flex;align-items:center;gap:5px;min-width:0">
                  <span style="width:7px;height:7px;flex:0 0 auto;border-radius:2.5px;background:{{ r.dot }};display:block"></span>
                  <span style="font-size:10.5px;color:#A29B90;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.space }}</span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
      </sc-if>

      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin-bottom:-12px">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto">
          <span style="width:11px;height:11px;border-radius:4px;background:#F2764C;display:block;flex:0 0 auto"></span>
          <h2 style="margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;flex:0 0 auto">일반 공간</h2>
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#B7ACA1;padding-top:2px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis">8 boards · 1 folder</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto">
          <button title="알림" style="width:32px;height:32px;flex:0 0 auto;border-radius:99px;border:1px solid #EFE4DA;background:#FFFDFB;color:#6E675F;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative" style-hover="background:#FBF3EE">
            <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 8-2 8h16s-2-2-2-8"></path><path d="M10.5 20a2 2 0 0 0 3 0"></path></svg>
            <span style="position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:99px;background:#E85E33;border:1.5px solid #FFFDFB;display:block"></span>
          </button>
          <div style="display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;border:1px solid #EFE4DA;background:#FFFDFB;width:200px">
            <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#B7ACA1" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input value="{{ query }}" sc-camel-on-change="{{ onQuery }}" placeholder="모든 스페이스에서 검색" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:12.5px;color:#3A352F">
          </div>
          <span style="width:1px;height:20px;background:#EFE4DA;display:block;flex:0 0 auto;margin:0 2px"></span>
          <button title="가져오기" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 auto;border-radius:99px;border:1px solid #EFE4DA;background:#FFFDFB;color:#6E675F;cursor:pointer" style-hover="background:#FBF3EE;color:#3A352F">
            <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M8 8l4-4 4 4M4 20h16"></path></svg>
          </button>
          <button style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid #EFE4DA;background:#FFFDFB;color:#3A352F;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="background:#FBF3EE">
            <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h5l2 2h9a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path><path d="M12 12v4M10 14h4"></path></svg>
            새 폴더
          </button>
          <button style="display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 15px;border-radius:99px;border:1px solid #E85E33;background:linear-gradient(180deg,#F2764C,#E85E33);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 10px 22px -12px rgba(232,94,51,.85)" style-hover="filter:brightness(1.05)">
            <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            새로 만들기
          </button>
        </div>
      </div>

      <section style="display:flex;flex-direction:column;gap:13px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12.5px;font-weight:700;color:#8A8078">폴더</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#C3B8AC">1</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px">
          <div class="gh-card" style="display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;border:1px solid #F0E6DC;background:#FFFDFB;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease">
            <span style="width:46px;height:46px;flex:0 0 auto;border-radius:14px;background:linear-gradient(180deg,#FBF1E9,#F6E7DB);border:1px solid #F0E0D0;display:inline-flex;align-items:center;justify-content:center">
              <svg width="21" height="21" sc-camel-view-box="0 0 24 24" fill="none" stroke="#D08256" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h5l2 2h9a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path></svg>
            </span>
            <span style="display:flex;flex-direction:column;gap:3px;min-width:0;flex:1">
              <span style="font-size:14px;font-weight:700;letter-spacing:-.01em">이력서 스크리닝</span>
              <span style="font-size:11.5px;color:#A29B90">보드 0개</span>
            </span>
            <svg class="gh-open" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#B7ACA1" stroke-width="2" stroke-linecap="round" style="opacity:0;transform:translateY(2px);transition:opacity .18s ease, transform .18s ease"><path d="m9 6 6 6-6 6"></path></svg>
          </div>
        </div>
      </section>

      <section style="display:flex;flex-direction:column;gap:13px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12.5px;font-weight:700;color:#8A8078">보드</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#C3B8AC">8</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax({{ colMin }},1fr));gap:16px">
          <sc-for list="{{ maps }}" as="m" hint-placeholder-count="8">
            <div class="gh-card" style="border-radius:18px;border:1px solid #F0E6DC;background:#FFFDFB;overflow:hidden;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;box-shadow:0 16px 32px -26px rgba(46,42,38,.42)">
              <div style="position:relative;height:150px;background:{{ m.wash }};overflow:hidden;border-bottom:1px solid #F4EBE3">
                <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(199,186,172,.45) 1px,transparent 1px);background-size:18px 18px"></div>
                <sc-for list="{{ m.shapes }}" as="s" hint-placeholder-count="4">
                  <div style="position:absolute;left:{{ s.l }};top:{{ s.t }};width:{{ s.w }};height:{{ s.h }};background:{{ s.bg }};border:1px solid {{ s.bd }};border-radius:{{ s.r }}"></div>
                </sc-for>
                <button class="{{ m.favClass }}" title="즐겨찾기" sc-camel-on-click="{{ m.onFav }}" style="position:absolute;top:10px;left:10px;z-index:2;width:28px;height:28px;border-radius:9px;border:1px solid #F0E6DC;background:rgba(255,253,251,.94);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);transition:opacity .16s ease" style-hover="background:#FFF7EE">
                  <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="{{ m.favFill }}" stroke="{{ m.favStroke }}" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3.6 2.5 5.2 5.6.8-4 4 .9 5.6-5-2.7-5 2.7.9-5.6-4-4 5.6-.8z"></path></svg>
                </button>
                <span style="position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;background:rgba(255,253,251,.92);border:1px solid #F0E6DC;font-size:10.5px;font-weight:700;color:#6E675F;backdrop-filter:blur(6px)">
                  <span style="width:6px;height:6px;border-radius:2px;background:{{ m.kindDot }};display:block"></span>
                  {{ m.kind }}
                </span>
              </div>
              <div style="padding:13px 14px 14px;display:flex;align-items:center;gap:10px">
                <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
                  <div style="display:flex;align-items:center;gap:6px;min-width:0">
                    <span style="font-size:14px;font-weight:700;letter-spacing:-.015em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ m.name }}</span>
                    <sc-if value="{{ m.shared }}" hint-placeholder-val="{{ false }}">
                      <svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="#B7ACA1" stroke-width="2" stroke-linecap="round" style="flex:0 0 auto"><circle cx="9" cy="8" r="3"></circle><path d="M3 19a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-6M21 19a5 5 0 0 0-4-4.9"></path></svg>
                    </sc-if>
                  </div>
                  <span style="font-size:11.5px;color:#A29B90">수정일 · {{ m.when }}</span>
                </div>
                <button class="gh-open" title="더보기" style="width:28px;height:28px;flex:0 0 auto;border-radius:9px;border:1px solid #EFE4DA;background:#FDF8F4;color:#8A8078;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:translateY(2px);transition:opacity .18s ease, transform .18s ease" style-hover="background:#FBF3EE;color:#3A352F">
                  <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
                </button>
              </div>
            </div>
          </sc-for>
        </div>
      </section>

    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F2764C&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#F2764C&quot;,&quot;#5B8DEF&quot;,&quot;#7CA84A&quot;,&quot;#E45DA0&quot;]},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;보통&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;촘촘하게&quot;,&quot;보통&quot;,&quot;넓게&quot;]},&quot;showRecents&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const PAL = {
  n: ['#FBEFB6', '#F2E294'],
  g: ['#DDEEDA', '#C7E0C3'],
  p: ['#FBDCD5', '#F3C4B9'],
  b: ['#E7EEFA', '#D3E0F3'],
  w: ['#FFFFFF', '#EDE3D9'],
  l: ['#E2D7CB', '#E2D7CB'],
};
const S = (l, t, w, h, k) => ({
  l: l + '%', t: t + '%', w: w + '%', h: h + '%',
  bg: PAL[k][0], bd: PAL[k][1], r: k === 'l' ? '99px' : '5px',
});

class Component extends DCLogic {
  state = { space: '일반 공간', query: '', favs: { 'map:1': true, 'recent:2': true } };

  fav(key) {
    const on = !!this.state.favs[key];
    return {
      favFill: on ? '#F5C062' : 'none',
      favStroke: on ? '#E8A93C' : '#B7ACA1',
      favClass: on ? 'gh-fav-on' : 'gh-fav-off',
      onFav: (e) => {
        e.stopPropagation();
        this.setState((s) => ({ favs: { ...s.favs, [key]: !s.favs[key] } }));
      },
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#F2764C';
    const density = this.props.density ?? '보통';
    const colMin = density === '넓게' ? '340px' : density === '촘촘하게' ? '236px' : '286px';

    const spaceMeta = [
      ['일반 공간', accent],
      ['원티드랩', '#5B8DEF'],
      ['화이트보드 테스트용', '#63A8E8'],
      ['칸반보드 테스트용', '#E45DA0'],
    ];
    const spaces = spaceMeta.map(([name, dot]) => {
      const active = this.state.space === name;
      return {
        name, dot, active,
        bg: active ? '#FBF1EB' : 'transparent',
        fg: active ? '#3A352F' : '#6E675F',
        weight: active ? 700 : 500,
        onPick: () => this.setState({ space: name }),
      };
    });

    const mind = [S(14, 44, 22, 4, 'l'), S(38, 42, 20, 4, 'l'), S(6, 34, 12, 28, 'p'), S(40, 20, 16, 20, 'w'), S(40, 60, 16, 20, 'w'), S(66, 14, 18, 18, 'n')];
    const board = [S(8, 18, 26, 30, 'n'), S(44, 24, 30, 34, 'w'), S(14, 62, 34, 22, 'g'), S(58, 66, 28, 20, 'n')];
    const board2 = [S(10, 14, 32, 40, 'p'), S(52, 30, 34, 30, 'n'), S(16, 66, 24, 20, 'w')];
    const kanban = [S(8, 14, 20, 68, 'w'), S(34, 14, 20, 50, 'n'), S(60, 14, 20, 60, 'g'), S(84, 14, 10, 34, 'b')];

    const kindDot = (k) => (k === '마인드맵' ? '#7FA6E8' : k === '칸반보드' ? '#69B08A' : accent);
    const recents = [
      ['통합 검색', '원티드랩', '#5B8DEF', mind, '#FCF7F1', false, '마인드맵'],
      ['새 화이트보드', '화이트보드 테스트용', '#63A8E8', board, '#FCFAF6', true, '화이트보드'],
      ['회고 (KPT)', '화이트보드 테스트용', '#63A8E8', kanban, '#FBFAF7', false, '화이트보드'],
      ['공동 편집 멘션 ...', '일반 공간', accent, board2, '#FCF8F5', true, '화이트보드'],
      ['이력서 스크리닝', '일반 공간', accent, mind, '#FCF9F5', false, '마인드맵'],
      ['ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ...', '일반 공간', accent, board2, '#FDF8F6', false, '화이트보드'],
      ['브레인스토밍', '화이트보드 테스트용', '#63A8E8', mind, '#FCF8F3', false, '마인드맵'],
      ['회고 (KPT)', '일반 공간', accent, board, '#FBFAF6', false, '화이트보드'],
      ['새 화이트보드', '일반 공간', accent, board2, '#FCF9F6', false, '화이트보드'],
      ['새 화이트보드', '일반 공간', accent, board, '#FCFAF7', false, '화이트보드'],
      ['칸반 보드', '화이트보드 테스트용', '#63A8E8', kanban, '#FBF9F6', false, '칸반보드'],
    ].map(([name, space, dot, shapes, wash, shared, kind], i) => ({
      name, space, dot, shapes, wash, shared, kind, kindDot: kindDot(kind), ...this.fav('recent:' + i),
    }));

    const maps = [
      ['이력서 스크리닝', '2일 전', '마인드맵', mind, '#FCF8F3', false],
      ['공동 편집 멘션 테스트', '2일 전', '화이트보드', board2, '#FCF9F6', true],
      ['ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅎㅎㅎㄷㅈ...', '1일 전', '화이트보드', board2, '#FDF9F7', false],
      ['새 화이트보드', '4일 전', '화이트보드', board, '#FCFAF6', false],
      ['새 화이트보드', '4일 전', '화이트보드', board, '#FBFAF7', false],
      ['회고 (KPT)', '4일 전', '화이트보드', kanban, '#FCF9F5', false],
      ['우선순위 정하기', '35분 전', '화이트보드', kanban, '#FBFAF6', false],
      ['학습 정리', '2일 전', '마인드맵', mind, '#FCF8F5', false],
    ].map(([name, when, kind, shapes, wash, shared], i) => ({
      name, when, kind, shapes, wash, shared,
      kindDot: kindDot(kind),
      ...this.fav('map:' + i),
    }));

    return {
      spaces, recents, maps, colMin,
      showRecents: this.props.showRecents ?? true,
      shared: [{ name: 'CDC 제거 2차' }, { name: '제가 바꿀게요' }],
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
    };
  }
}

</script>


</body></html>
