# Supabase project config for the GitHub integration and the Supabase CLI.
#
# `project_id` is the project ref (it appears in the project URL /
# `https://<ref>.supabase.co` — public, NOT a secret). It links this repo's
# `supabase/migrations/` to the Supabase project so that merging to the
# production branch auto-applies any new migration files, and PRs get an
# ephemeral preview database (Branching). See server/supabase/docs/backend.md.
project_id = "qdzfonyqysbbchxotnrm"

# 멘션 메일 다이제스트(0039) — **cron이 부르는 함수라 사용자 JWT가 없다.**
# 그래서 JWT 검증을 끄고, 대신 `DIGEST_SECRET` 헤더로 문을 잠근다(함수 주석 참고).
# 그 비밀의 힘은 "회차를 한 번 돌린다"가 전부라, service_role 키를 cron 잡에 적어
# 두는 것보다 폭발 반경이 훨씬 작다.
[functions.notify-digest]
verify_jwt = false

# 멘션 웹 푸시(0040) — 같은 이유로 JWT 검증을 끄고 `DIGEST_SECRET` 헤더로 잠근다.
# 비밀을 다이제스트와 **같은 것**으로 둔 이유: 설정할 값이 둘이면 하나를 빠뜨리기
# 쉽고, 두 함수가 여는 문은 같은 종류다("알림 회차를 한 번 돌린다").
[functions.notify-push]
verify_jwt = false
