          <svg width="17" height="17" sc-camel-view-box="0 0 48 48" style="flex:0 0 auto"><path fill="#4285F4" d="M45 24c0-1.6-.1-2.7-.4-4H24v8h12c-.2 2-1.5 5-4.8 7l7.3 5.7C42.8 36.4 45 30.8 45 24z"></path><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.3-5.7C29.3 36.3 26.9 37 24 37c-5.7 0-10.6-3.8-12.3-9l-7.6 5.9C7.7 41.3 15.2 46 24 46z"></path><path fill="#FBBC05" d="M11.7 28c-.5-1.3-.7-2.6-.7-4s.3-2.7.7-4l-7.6-5.9C2.5 17.1 2 20.5 2 24s.5 6.9 2.1 9.9l7.6-5.9z"></path><path fill="#EA4335" d="M24 11c3.2 0 6 1.1 8.2 3.2l6.4-6.4C34.8 4.1 29.9 2 24 2 15.2 2 7.7 6.7 4.1 14.1l7.6 5.9C13.4 14.8 18.3 11 24 11z"></path></svg>

        <div style="display:flex;align-items:center;gap:12px">

        <div style="display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid #F3E9E0;background:#FDFAF7">
          <span style="display:flex;gap:5px;flex:0 0 auto">
            <span style="width:8px;height:8px;border-radius:99px;background:#E7DCCF;display:block"></span>
            <span style="width:8px;height:8px;border-radius:99px;background:#E7DCCF;display:block"></span>
            <span style="width:8px;height:8px;border-radius:99px;background:#E7DCCF;display:block"></span>
          </span>
          <span style="flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#A79C90;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ boardTitle }}</span>
          <span style="display:flex;flex:0 0 auto">
            <span style="width:20px;height:20px;border-radius:99px;background:#EE6B45;border:1.5px solid #FDFAF7;color:#fff;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center">지</span>
            <span style="width:20px;height:20px;margin-left:-6px;border-radius:99px;background:#4A8FE0;border:1.5px solid #FDFAF7;color:#fff;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center">민</span>
          </span>
        </div>

        <div style="position:relative;height:clamp(300px,32vw,364px);background:#FCF8F3;background-image:radial-gradient(rgba(199,186,172,.5) 1.1px,transparent 1.1px);background-size:19px 19px;overflow:hidden">

          <svg sc-camel-view-box="0 0 100 100" sc-camel-preserve-aspect-ratio="none" style="position:absolute;inset:0;width:100%;height:100%">
            <sc-for list="{{ boardEdges }}" as="e" hint-placeholder-count="3">
              <path d="{{ e.d }}" fill="none" stroke="#E9A98F" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-dasharray:200;animation:lgDraw .7s cubic-bezier(.3,.8,.3,1) {{ e.delay }} both"></path>
            </sc-for>
          </svg>

          <sc-for list="{{ boardShapes }}" as="s" hint-placeholder-count="6">
            <div style="position:absolute;left:{{ s.l }};top:{{ s.t }};width:{{ s.w }};height:{{ s.h }};display:flex;align-items:{{ s.align }};justify-content:{{ s.justify }};padding:{{ s.pad }};border-radius:{{ s.r }};background:{{ s.bg }};border:{{ s.border }};box-shadow:{{ s.shadow }};color:{{ s.color }};font-size:{{ s.fs }};font-weight:{{ s.fw }};line-height:1.45;letter-spacing:-.012em;white-space:{{ s.wrap }};overflow:hidden;animation:{{ s.anim }}">{{ s.text }}</div>
          </sc-for>

          <div style="position:absolute;left:{{ pinL }};top:{{ pinT }};display:flex;align-items:center;gap:7px;max-width:44%;animation:lgPin 5.6s ease-in-out infinite">
            <span style="width:25px;height:25px;flex:0 0 auto;border-radius:99px 99px 99px 5px;background:#EE6B45;color:#fff;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 9px 16px -9px rgba(238,107,69,.9)">지수</span>
            <span style="min-width:0;height:24px;padding:0 10px;border-radius:99px;background:#FFFDFB;border:1px solid #F0E6DC;font-size:11px;font-weight:600;color:#6E675F;display:inline-flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 9px 18px -13px rgba(46,42,38,.5)">{{ pinText }}</span>
          </div>

          <div style="position:absolute;left:{{ curL }};top:{{ curT }};display:{{ curDisplay }};animation:lgCursor 8s ease-in-out infinite">
            <svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="#4A8FE0" stroke="#FDFAF7" stroke-width="1.4" style="display:block;filter:drop-shadow(0 3px 6px rgba(46,42,38,.35))"><path d="M5 3l14 8-6.5 1.6L9.5 19z"></path></svg>
            <span style="position:absolute;left:15px;top:15px;height:18px;padding:0 7px;border-radius:5px;background:#4A8FE0;color:#fff;font-size:9.5px;font-weight:700;line-height:18px;white-space:nowrap">민준</span>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:9px;padding:10px 13px;border-top:1px solid #F3E9E0;background:#FDFAF7">
          <span style="font-size:11.5px;color:#8A8078;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ boardCaption }}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#B7ACA1;white-space:nowrap;flex:0 0 auto">자동 저장됨</span>
        </div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;마인드맵, 화이트보드, 칸반 보드가 기다리고 있어요.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showPeek&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = {
    view: 'signin', email: '', password: '', password2: '', code: '',
    show: false, remember: true, loading: false, sent: false, resendLeft: 0,
    wide: true, tick: 0, pinned: null, anim: 0,
  };

  go(view, extra) {
    clearTimeout(this._t);
    this.setState(Object.assign({ view: view, loading: false, password2: '', code: '', show: false }, extra || {}));
  }

  startResend() {
    clearInterval(this._resendT);
    this.setState({ resendLeft: 60 });
    this._resendT = setInterval(() => {
      const left = this.state.resendLeft - 1;
      if (left <= 0) { clearInterval(this._resendT); this.setState({ resendLeft: 0 }); }
      else this.setState({ resendLeft: left });
    }, 1000);
  }

  get mode() {
    const order = ['mind', 'board', 'kanban'];
    return this.state.pinned || order[this.state.tick % 3];
  }

  pickMode(m) {
    this._held = true;
    clearTimeout(this._holdT);
    this._holdT = setTimeout(() => { this._held = false; this.setState({ pinned: null }); }, 15000);
    if (m !== this.mode) this.setState(s => ({ pinned: m, anim: 1 - s.anim }));
  }

  componentDidMount() {
    clearInterval(this._rot);
    this._rot = setInterval(() => {
      if (this._held) return;
      this.setState(s => ({ tick: (s.tick || 0) + 1, anim: 1 - s.anim }));
    }, 4200);
    this._fit = () => {
      const wide = window.innerWidth >= 880;
      if (wide !== this.state.wide) this.setState({ wide: wide });
    };
    this._fit();
    window.addEventListener('resize', this._fit);
  }

  componentWillUnmount() {
    clearTimeout(this._t);
    clearTimeout(this._holdT);
    clearInterval(this._rot);
    clearInterval(this._resendT);
    window.removeEventListener('resize', this._fit);
  }

  ready() {
    const s = this.state;
    const mail = s.email.trim().length > 2 && s.email.indexOf('@') > 0;
    if (s.view === 'signin') return mail && s.password.length > 0;
    if (s.view === 'signup') return mail && s.password.length >= 8 && s.password === s.password2;
    if (s.view === 'forgot') return mail;
    if (s.view === 'verify') return s.code.trim().length === 6;
    return s.code.trim().length === 6 && s.password.length >= 8 && s.password === s.password2;
  }

  submit(force) {
    const v = this.state.view;
    if (this.state.loading || (!this.ready() && !force)) return;
    this.setState({ loading: true });
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      if (v === 'forgot') {
        this.setState({ loading: false, view: 'reset', sent: true, password: '', password2: '' });
        this.startResend();
      } else if (v === 'signup') {
        this.setState({ loading: false, view: 'verify', sent: true, code: '' });
        this.startResend();
      } else {
        this.setState({ loading: false });
      }
    }, 1400);
  }

  scene() {
    const st = { mode: this.mode };
    const box = (l, t, w, h, o) => Object.assign({
      l: l + '%', t: t + '%', w: w + '%', h: h + '%',
      align: 'center', justify: 'flex-start', pad: '0 13px', r: '11px',
      bg: '#FFFDFB', border: '1px solid #EADFD4', shadow: '0 10px 20px -16px rgba(46,42,38,.5)',
      color: '#3A352F', fs: '12.5px', fw: 600, wrap: 'nowrap', text: '',
    }, o || {});

    if (st.mode === 'mind') {
      return {
        title: '이번 분기 계획 · 마인드맵',
        caption: '지수님이 방금 가지를 추가했어요',
        pin: ['52%', '31%'], pinText: '여기부터 볼게요', cursor: ['12%', '68%'],
        edges: [
          { d: 'M32 50 C39 50, 39 21, 46 21', delay: '.16s' },
          { d: 'M32 50 C39 50, 39 50, 46 50', delay: '.24s' },
          { d: 'M32 50 C39 50, 39 79, 46 79', delay: '.32s' },
        ],
        items: [
          box(5, 43, 27, 12, { text: '이번 분기 목표', bg: '#EE6B45', border: '1px solid #EE6B45', color: '#fff', fw: 800, fs: '13.5px', r: '999px', justify: 'center', pad: '0 10px', shadow: '0 14px 26px -14px rgba(238,107,69,.8)' }),
          box(46, 14, 32, 11, { text: '온보딩 다시 그리기' }),
          box(46, 43, 24, 11, { text: '가격 실험' }),
          box(46, 72, 27, 11, { text: '리텐션 지표' }),
          box(6, 6, 30, 20, { text: '첫 화면에서 뭘 먼저 보여줄까', bg: '#FCF4C9', border: '1px solid #EEDD8F', color: '#7A6A35', fs: '11.5px', align: 'flex-start', pad: '10px 12px', r: '12px', wrap: 'normal', shadow: '0 14px 26px -20px rgba(46,42,38,.55)' }),
        ],
      };
    }

    if (st.mode === 'board') {
      const note = (l, t, w, h, text, tone) => box(l, t, w, h, {
        text: text, align: 'flex-start', pad: '10px 11px', r: '12px', fs: '11.5px', wrap: 'normal',
        bg: tone === 'y' ? '#FCF4C9' : tone === 'p' ? '#FBDCD5' : tone === 'g' ? '#E4F1E8' : '#FFFDFB',
        border: '1px solid ' + (tone === 'y' ? '#EEDD8F' : tone === 'p' ? '#F0BEB1' : tone === 'g' ? '#C2DCBE' : '#EADFD4'),
        color: tone === 'y' ? '#7A6A35' : tone === 'p' ? '#8A5442' : tone === 'g' ? '#43714F' : '#3A352F',
        shadow: '0 14px 26px -20px rgba(46,42,38,.55)',
      });
      return {
        title: '문제 정의 워크숍 · 화이트보드',
        caption: '민준님이 메모를 옮겼어요',
        pin: ['62%', '62%'], pinText: '이건 투표할까요?', cursor: ['78%', '74%'],
        edges: [],
        items: [
          box(4, 8, 44, 84, { text: '', bg: 'rgba(74,143,224,.05)', border: '1.5px dashed #A9C4EA', shadow: 'none', r: '13px' }),
          note(8, 16, 17, 24, '지금 막히는 곳', 'y'),
          note(28, 14, 17, 22, '문의 3건', 'y'),
          note(8, 46, 17, 22, '온보딩 이탈', 'p'),
          note(28, 42, 17, 26, '가격표 혼동', 'p'),
          note(14, 74, 24, 15, '다음 액션 2개', 'g'),
          note(54, 12, 21, 28, '아이디어 스티커', 'w'),
          note(78, 22, 18, 24, '스케치 첨부', 'w'),
        ],
      };
    }

    const col = (l, title, cards) => {
      const out = [
        box(l, 6, 28, 88, { text: '', bg: '#FDFAF7', border: '1px solid #EFE4DA', shadow: 'none', r: '13px' }),
        box(l + 2, 10, 24, 8, { text: title, bg: 'transparent', border: '0', shadow: 'none', fs: '10.5px', fw: 800, color: '#8A8078', pad: '0 3px' }),
      ];
      cards.forEach((c, i) => out.push(box(l + 2, 21 + i * 21, 24, 17, {
        text: c[0], align: 'flex-start', pad: '8px 9px', fs: '10.5px', r: '9px', wrap: 'normal',
        border: c[1] ? '1px solid #F5D9CD' : '1px solid #F1E7DE',
        shadow: '0 8px 16px -13px rgba(46,42,38,.5)',
      })));
      return out;
    };
    return {
      title: '8월 스프린트 · 칸반 보드',
      caption: '카드 2개가 완료로 옮겨졌어요',
      pin: ['36%', '74%'], pinText: '이건 다음 주로', cursor: ['6%', '83%'],
      edges: [],
      items: []
        .concat(col(4, '할 일', [['랜딩 카피 정리'], ['가격 실험 설계', true], ['FAQ 보강']]))
        .concat(col(36, '진행 중', [['온보딩 재설계'], ['리텐션 지표']]))
        .concat(col(68, '완료', [['공유 링크 개선'], ['버그 12건'], ['8월 회고']])),
    };
  }

  renderVals() {
    const st = this.state;
    const v = st.view;
    const ready = this.ready();
    const sc = this.scene();
    const stop = e => { if (e && e.preventDefault) e.preventDefault(); };
    const MAIL = '<rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3.4 6.3 7.5 5.6a2 2 0 0 0 2.2 0l7.5-5.6"/><path d="M3.2 17.8 9 12.4M20.8 17.8 15 12.4"/>';
    const KEY = '<circle cx="8.5" cy="15.5" r="4.2"/><path d="m11.6 12.4 8.2-8.2"/><path d="m15.8 8.2 2.6 2.6"/><path d="m18.4 5.6 2.6 2.6"/><path d="M6.9 15.5h.01"/>';

    const copy = {
      signin: ['Sign in', '보드를 열어볼까요.', this.props.subtitle ?? '마인드맵, 화이트보드, 칸반 보드가 기다리고 있어요.'],
      signup: ['Sign up', '가입하기', '몇 초면 첫 보드를 열 수 있어요.'],
      forgot: ['Reset', '비밀번호 찾기', '가입한 이메일로 재설정 코드를 보내드릴게요.'],
      reset: ['Reset', '새 비밀번호 설정', '메일로 받은 코드를 넣고 새 비밀번호를 정해 주세요.'],
      verify: ['Verify', '이메일 인증', '거의 다 왔어요. 인증만 마치면 시작할 수 있어요.'],
    }[v];
    const A = st.anim ? 'lgPop' : 'lgPop2';

    return {
      modeChips: [['mind', '마인드맵', '#4A8FE0'], ['board', '화이트보드', '#EE6B45'], ['kanban', '칸반 보드', '#69B08A']].map(([key, name, dot]) => {
        const on = this.mode === key;
        return {
          name: name, dot: on ? dot : '#D8CBBD',
          bg: on ? '#FBEDE6' : 'transparent',
          border: on ? '#F0D8CA' : '#EFE5DB',
          fg: on ? '#C9512A' : '#A29B90',
          onPick: () => this.pickMode(key),
        };
      }),
      boardTitle: sc.title,
      boardCaption: sc.caption,
      boardEdges: sc.edges,
      pinL: sc.pin[0],
      pinT: sc.pin[1],
      pinText: sc.pinText,
      curL: sc.cursor[0],
      curT: sc.cursor[1],
      curDisplay: sc.cursor[2] === false ? 'none' : 'block',
      boardShapes: sc.items.map((it, i) => Object.assign({}, it, {
        anim: A + ' .34s cubic-bezier(.2,.8,.3,1) ' + (0.022 * i).toFixed(3) + 's both',
      })),

      eyebrow: copy[0],
      viewTitle: copy[1],
      viewSub: copy[2],

      showOauth: v === 'signin' || v === 'signup',
      showIntro: v === 'forgot' || v === 'reset' || v === 'verify',
      introBg: v === 'forgot' ? '#FBEDE6' : '#FBEDE6',
      introFg: '#D0562F',
      introIcon: { __html: v === 'forgot' ? KEY : MAIL },
      introText: v === 'forgot'
        ? '가입할 때 쓴 이메일 주소를 넣어 주세요. 그 주소로 6자리 코드를 보내드려요.'
        : (st.email.trim() || 'name@company.com') + ' 로 인증 코드를 보냈어요. 메일함에서 코드를 확인해 주세요.',

      showEmail: v === 'signin' || v === 'signup' || v === 'forgot',
      showCode: v === 'reset' || v === 'verify',
      showPw: v === 'signin' || v === 'signup' || v === 'reset',
      showPw2: v === 'signup' || v === 'reset',
      showRemember: v === 'signin',
      showForgotLink: v === 'signin',
      showSentNotice: (v === 'reset' || v === 'verify') && st.sent,
      pwLabel: v === 'reset' ? '새 비밀번호' : '비밀번호',
      pw2Label: v === 'reset' ? '새 비밀번호 확인' : '비밀번호 확인',
      password2: st.password2,
      onPassword2: e => this.setState({ password2: e.target.value }),
      pw2Mismatch: st.password2.length > 0 && st.password !== st.password2,
      pw2Border: st.password2.length > 0 && st.password !== st.password2 ? '#E9A08A' : '#E6DCD1',
      code: st.code,
      onCode: e => this.setState({ code: e.target.value.replace(/[^0-9]/g, '').slice(0, 6) }),

      showSwap: v === 'signin' || v === 'signup',
      swapText: v === 'signin' ? '아직 계정이 없으신가요?' : '이미 계정이 있으신가요?',
      swapCta: v === 'signin' ? '가입하기' : '로그인',
      onSwap: e => { stop(e); this.go(v === 'signin' ? 'signup' : 'signin'); },
      goForgot: e => { stop(e); this.go('forgot', { password: '' }); },
      goSignin: e => { stop(e); this.go('signin', { password: '', sent: false }); },
      showBackRow: v === 'forgot' || v === 'reset' || v === 'verify',
      backLabel: v === 'reset' ? '이메일 다시 입력' : (v === 'verify' ? '뒤로' : '로그인으로 돌아가기'),
      showResend: v === 'reset' || v === 'verify',
      resendText: st.resendLeft > 0 ? '코드가 안 왔나요? ' + st.resendLeft + '초 후 다시 보내기' : '코드 다시 보내기',
      resendDisabled: st.resendLeft > 0,
      resendColor: st.resendLeft > 0 ? '#B7ACA1' : '#C9512A',
      resendCursor: st.resendLeft > 0 ? 'default' : 'pointer',
      onResend: () => { if (this.state.resendLeft === 0) { this.setState({ code: '', sent: true }); this.startResend(); } },
      goBack: e => {
        stop(e);
        if (v === 'reset') this.go('forgot', { email: st.email, password: '', sent: false });
        else if (v === 'verify') this.go('signup', { email: st.email, sent: false });
        else this.go('signin', { password: '', sent: false });
      },
      peekDisplay: (this.props.showPeek !== false) && st.wide ? 'block' : 'none',

      email: st.email,
      password: st.password,
      onEmail: e => this.setState({ email: e.target.value }),
      onPassword: e => this.setState({ password: e.target.value }),
      onKey: e => { if (e.key === 'Enter') this.submit(); },

      pwType: st.show ? 'text' : 'password',
      pwTitle: st.show ? '비밀번호 가리기' : '비밀번호 보기',
      pwIcon: {
        __html: st.show
          ? '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/>'
          : '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
      },
      togglePw: () => this.setState(s => ({ show: !s.show })),

      cbBg: st.remember ? '#EE6B45' : '#FFFDFB',
      cbBorder: st.remember ? '#EE6B45' : '#D8CBBD',
      cbOpacity: st.remember ? 1 : 0,
      toggleRemember: () => this.setState(s => ({ remember: !s.remember })),

      loading: st.loading,
      submitLabel: st.loading
        ? { signin: '들어가는 중', signup: '만드는 중', forgot: '보내는 중', reset: '바꾸는 중', verify: '확인하는 중' }[v]
        : { signin: '로그인', signup: '가입하기', forgot: '재설정 코드 보내기', reset: '비밀번호 재설정', verify: '인증하고 시작하기' }[v],
      submitBg: ready || st.loading ? '#EE6B45' : '#E8B7A4',
      submitCursor: st.loading ? 'progress' : (ready ? 'pointer' : 'not-allowed'),
      submitDisabled: !ready && !st.loading,
      submitShadow: ready ? '0 16px 30px -16px rgba(238,107,69,.72)' : 'none',
      onSubmit: () => this.submit(),
      onGoogle: () => { if (!this.state.loading) { this.setState({ loading: true }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ loading: false }), 1400); } },
    };
  }
}

</script>
